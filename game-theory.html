<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>STRATAGEM — Forge Your Game Theory Instincts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind (CDN, just for basic styling) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <!-- React + ReactDOM (UMD builds from CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Lucide icons (ESM bundle) -->
  <script type="module" src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background: #020617;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    /* Simple scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 999px;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo } = React;

    // Tiny helpers (no clsx/tailwind-merge to keep it simple)
    function cn() {
      return Array.from(arguments).filter(Boolean).join(" ");
    }

    // --- TYPES via JSDoc (for clarity only) ---
    /**
     * @typedef {"Easy" | "Medium" | "Hard" | "SUPER-HARD"} Difficulty
     */

    // --- DATA GENERATION: simplified clone of your Stratagem.tsx ---

    function makeConcept(name, icon) {
      return { name, icon };
    }

    const concepts = [
      makeConcept("Prisoner's Dilemma", "users"),
      makeConcept("Coordination Game", "scale"),
      makeConcept("Repeated Games", "rotate-ccw"),
      makeConcept("Hawk-Dove Game", "sword"),
      makeConcept("Stag Hunt", "target"),
      makeConcept("Bargaining Power & BATNA", "briefcase-business"),
      makeConcept("Cournot Competition", "trending-up"),
      makeConcept("Vickrey Auction", "gavel"),
      makeConcept("Principal-Agent Problem", "building-2"),
      makeConcept("Adverse Selection", "eye"),
      makeConcept("Grim Trigger Strategy", "lock"),
      makeConcept("Median Voter Theorem", "vote"),
      makeConcept("War of Attrition", "hourglass"),
      makeConcept("Bayesian Equilibrium", "cpu"),
      makeConcept("Zero-Sum vs. Non-Zero-Sum", "globe-2")
    ];

    const domains = ["Daily Life", "Business", "Diplomacy", "Geopolitics"];
    const difficulties = ["Easy", "Medium", "Hard", "SUPER-HARD"];

    function buildLevels() {
      /** @type {any[]} */
      const levels = [];

      for (let c = 0; c < concepts.length; c++) {
        const concept = concepts[c];
        for (let i = 0; i < 5; i++) {
          const id = c * 5 + i + 1;
          const domain = domains[i % domains.length];
          const difficulty = /** @type {Difficulty} */ (difficulties[Math.min(i, 3)]);
          let title = concept.name + " Scenario " + (i + 1);
          let vignette =
            "A complex situation involving " +
            concept.name.toLowerCase() +
            ". You must decide your move.";
          let options = [
            {
              id: "opt1",
              label: "Option A",
              description: "Strategy A",
              payoff: { opt1: 3, opt2: 0 }
            },
            {
              id: "opt2",
              label: "Option B",
              description: "Strategy B",
              payoff: { opt1: 5, opt2: 1 }
            }
          ];
          /** @type {string[] | undefined} */
          let aiOptions = undefined;

          // Custom IDs (only a subset to keep the file smaller)
          if (id === 1) {
            title = "The Roommate Dilemma";
            vignette =
              "You and your roommate both want a clean apartment, but neither wants to do the work. If you both clean, it's perfect. If only one cleans, they feel exploited. If neither cleans, you live in filth.";
            options = [
              {
                id: "cooperate",
                label: "Clean",
                description: "Put in the effort for a better home.",
                payoff: { cooperate: 3, defect: 0 }
              },
              {
                id: "defect",
                label: "Slack",
                description: "Let them handle it while you relax.",
                payoff: { cooperate: 5, defect: 1 }
              }
            ];
          } else if (id === 6) {
            title = "The First Date Split";
            vignette =
              "The bill arrives. You can offer to pay, split, or wait for them. You both want to look generous but don't want to be the only one paying a massive bill.";
            options = [
              {
                id: "pay",
                label: "Offer to Pay",
                description: "Show extreme generosity.",
                payoff: { pay: 2, split: 1 }
              },
              {
                id: "split",
                label: "Suggest Split",
                description: "The fair, modern approach.",
                payoff: { pay: 4, split: 3 }
              }
            ];
          } else if (id === 11) {
            title = "Traffic Negotiation";
            vignette =
              "Two lanes merge into one. You can 'Zip' (let one in) or 'Block'. If everyone blocks, traffic grinds to a halt. If everyone zips, it flows.";
            options = [
              {
                id: "zip",
                label: "Zip Merge",
                description: "Be polite and maintain flow.",
                payoff: { zip: 3, block: 1 }
              },
              {
                id: "block",
                label: "Block",
                description: "Assert your position.",
                payoff: { zip: 4, block: 0 }
              }
            ];
          } else if (id === 16) {
            title = "The Hawk-Dove Conflict";
            vignette =
              "You and a colleague both want the last slice of pizza. You can be a 'Hawk' (fight for it) or a 'Dove' (share it). If both are Hawks, you both get hurt.";
            options = [
              {
                id: "hawk",
                label: "Hawk",
                description: "Fight for the resource.",
                payoff: { hawk: -5, dove: 10 }
              },
              {
                id: "dove",
                label: "Dove",
                description: "Offer to share.",
                payoff: { hawk: 0, dove: 5 }
              }
            ];
          }

          levels.push({
            id,
            title,
            difficulty,
            domain,
            vignette,
            aiOptions,
            aiStrategy: "rational",
            options,
            theoryInsight: {
              concept: concept.name,
              definition:
                "A core principle in game theory where " +
                concept.name.toLowerCase() +
                " dictates the optimal strategy.",
              explanation:
                "In this scenario, " +
                concept.name +
                " explains why players often reach a specific equilibrium.",
              realWorldParallel:
                "This is seen in " +
                domain.toLowerCase() +
                " contexts where strategic interaction is key.",
              nextLevelTip: "Think about the long-term consequences of your move."
            }
          });
        }
      }

      return levels.sort((a, b) => a.id - b.id);
    }

    const ALL_LEVELS = buildLevels();

    const BADGES = [
      {
        id: "first_win",
        name: "First Instinct",
        description: "Complete your first scenario."
      },
      {
        id: "legend",
        name: "Theory Legend",
        description: "Reach Level 75 in Campaign."
      }
    ];

    function Button(props) {
      const { children, onClick, variant = "primary", className, disabled } = props;
      const base =
        "px-4 py-2 rounded-xl text-sm font-medium transition-all inline-flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-900/20",
        secondary: "bg-slate-800 hover:bg-slate-700 text-slate-100",
        outline: "border border-slate-700 hover:border-slate-500 text-slate-300",
        ghost: "hover:bg-slate-800 text-slate-400 hover:text-white",
        neon:
          "bg-cyan-500 hover:bg-cyan-400 text-black font-bold shadow-[0_0_20px_rgba(6,182,212,0.5)]"
      };
      return React.createElement(
        "button",
        {
          onClick,
          disabled,
          className: cn(base, variants[variant], className)
        },
        children
      );
    }

    function Card(props) {
      return React.createElement(
        "div",
        {
          onClick: props.onClick,
          className: cn(
            "bg-slate-900/50 border border-slate-800 rounded-2xl p-5 backdrop-blur-sm transition-all",
            props.onClick && "cursor-pointer hover:border-blue-500/50 hover:bg-slate-800/80",
            props.className
          )
        },
        props.children
      );
    }

    function StratagemApp() {
      const [view, setView] = useState("hub"); // skip splash/onboarding for simplicity
      const [currentLevelId, setCurrentLevelId] = useState(1);
      const [score, setScore] = useState(0);
      const [instinctLevel, setInstinctLevel] = useState(10);
      const [completed, setCompleted] = useState([]);
      const [badges, setBadges] = useState([]);
      const [selectedOption, setSelectedOption] = useState(null);
      const [aiChoice, setAiChoice] = useState(null);
      const [showInsight, setShowInsight] = useState(false);
      const [difficultyTab, setDifficultyTab] = useState("Easy");

      const currentLevel =
        ALL_LEVELS.find((l) => l.id === currentLevelId) || ALL_LEVELS[0];

      function openLevel(id) {
        setCurrentLevelId(id);
        setView("level");
        setSelectedOption(null);
        setAiChoice(null);
        setShowInsight(false);
      }

      function handleChoice(optionId) {
        if (selectedOption) return;
        const aiMoves = currentLevel.aiOptions || currentLevel.options.map((o) => o.id);
        const choice = aiMoves[Math.floor(Math.random() * aiMoves.length)];
        setSelectedOption(optionId);
        setAiChoice(choice);

        const option = currentLevel.options.find((o) => o.id === optionId);
        const payoff = (option && option.payoff[choice]) || 0;
        const delta = payoff * (instinctLevel / 10);

        setTimeout(() => {
          setScore((s) => s + delta);
          setInstinctLevel((x) => Math.min(100, x + (payoff >= 3 ? 2 : 0.5)));
          setCompleted((prev) =>
            prev.includes(currentLevel.id) ? prev : prev.concat(currentLevel.id)
          );

          setBadges((prev) => {
            const next = prev.slice();
            if (!next.includes("first_win")) next.push("first_win");
            if (completed.length + 1 >= 75 && !next.includes("legend"))
              next.push("legend");
            return next;
          });

          setShowInsight(true);
        }, 800);
      }

      if (view === "hub") {
        return (
          React.createElement("div", { className: "min-h-screen px-4 py-8 max-w-5xl mx-auto" },
            React.createElement("header", { className: "flex justify-between items-center mb-8" },
              React.createElement("div", null,
                React.createElement("h1", { className: "text-2xl font-black italic" }, "STRATAGEM"),
                React.createElement("p", { className: "text-xs text-slate-500" },
                  "Forge Your Game Theory Instincts"
                )
              ),
              React.createElement("div", { className: "text-right" },
                React.createElement("div", { className: "text-sm text-slate-400" }, "Score"),
                React.createElement("div", { className: "text-xl font-bold text-cyan-400" },
                  Math.floor(score)
                )
              )
            ),
            React.createElement(Card, { className: "mb-8" },
              React.createElement("h2", { className: "text-xl font-bold mb-2" }, "Instinct Level"),
              React.createElement("div", { className: "h-2 bg-slate-800 rounded-full overflow-hidden mb-2" },
                React.createElement("div", {
                  className: "h-full bg-gradient-to-r from-blue-500 to-cyan-400",
                  style: { width: instinctLevel + "%" }
                })
              ),
              React.createElement("p", { className: "text-xs text-slate-400" },
                "Complete scenarios from daily life to geopolitics and watch your instincts grow."
              )
            ),
            React.createElement("div", { className: "flex items-center justify-between mb-4" },
              React.createElement("h2", { className: "text-lg font-semibold" }, "Campaign"),
              React.createElement("div", { className: "flex gap-1 text-xs" },
                ["Easy", "Medium", "Hard", "SUPER-HARD"].map((d) =>
                  React.createElement("button", {
                    key: d,
                    className: cn(
                      "px-2 py-1 rounded-md border",
                      difficultyTab === d
                        ? "bg-blue-600 border-blue-500 text-white"
                        : "border-slate-700 text-slate-400"
                    ),
                    onClick: () => setDifficultyTab(d)
                  }, d)
                )
              )
            ),
            React.createElement("div", { className: "grid sm:grid-cols-2 lg:grid-cols-3 gap-3" },
              ALL_LEVELS.filter((l) => l.difficulty === difficultyTab).map((level) =>
                React.createElement(Card, {
                  key: level.id,
                  onClick: () => openLevel(level.id),
                  className: "h-full flex flex-col justify-between"
                },
                  React.createElement("div", null,
                    React.createElement("p", { className: "text-[10px] text-slate-500 uppercase mb-1" },
                      "Level ", level.id, " \u00b7 ", level.domain
                    ),
                    React.createElement("h3", { className: "font-semibold text-sm mb-1" }, level.title)
                  ),
                  React.createElement("p", {
                    className: "text-[10px] text-slate-500 mt-2"
                  }, completed.includes(level.id) ? "Completed" : "New")
                )
              )
            ),
            React.createElement("div", { className: "mt-8" },
              React.createElement("h2", { className: "text-lg font-semibold mb-2" }, "Badges"),
              React.createElement("div", { className: "flex gap-3 text-xs flex-wrap" },
                BADGES.map((b) =>
                  React.createElement("div", {
                    key: b.id,
                    className: cn(
                      "px-3 py-2 rounded-xl border",
                      badges.includes(b.id)
                        ? "border-emerald-500 bg-emerald-500/10"
                        : "border-slate-700 bg-slate-900/40 opacity-40"
                    )
                  },
                    React.createElement("div", { className: "font-semibold" }, b.name),
                    React.createElement("div", { className: "text-[10px] text-slate-400" }, b.description)
                  )
                )
              )
            )
          )
        );
      }

      // LEVEL VIEW
      return (
        React.createElement("div", { className: "min-h-screen px-4 py-8 max-w-4xl mx-auto" },
          React.createElement("header", { className: "flex items-center justify-between mb-6" },
            React.createElement(Button, {
              variant: "ghost",
              onClick: () => setView("hub")
            }, "← Back"),
            React.createElement("div", { className: "text-center" },
              React.createElement("p", { className: "text-[11px] text-slate-500 uppercase" },
                "Level ", currentLevel.id, " · ", currentLevel.difficulty
              ),
              React.createElement("h1", { className: "text-lg font-bold" }, currentLevel.title)
            ),
            React.createElement("div", { className: "w-16" })
          ),
          React.createElement(Card, { className: "mb-6" },
            React.createElement("p", { className: "text-slate-200 text-sm" }, currentLevel.vignette)
          ),
          React.createElement("div", { className: "grid sm:grid-cols-2 gap-4 mb-6" },
            currentLevel.options.map((opt) =>
              React.createElement(Card, {
                key: opt.id,
                onClick: () => handleChoice(opt.id),
                className: cn(
                  "border-2",
                  selectedOption === opt.id
                    ? "border-blue-500 bg-blue-500/10"
                    : "border-slate-800",
                  selectedOption && selectedOption !== opt.id && "opacity-40"
                )
              },
                React.createElement("h3", { className: "font-semibold mb-1" }, opt.label),
                React.createElement("p", { className: "text-xs text-slate-400" }, opt.description),
                selectedOption === opt.id && aiChoice &&
                  React.createElement("div", {
                    className:
                      "mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs"
                  },
                    React.createElement("span", { className: "text-slate-400" },
                      "Opponent: ",
                      React.createElement("span", { className: "text-slate-200 font-semibold" }, aiChoice)
                    ),
                    React.createElement("span", { className: "text-cyan-400 font-bold" },
                      "+", opt.payoff[aiChoice] || 0, " pts"
                    )
                  )
              )
            )
          ),
          showInsight &&
            React.createElement(Card, null,
              React.createElement("h3", {
                className:
                  "text-xs uppercase tracking-widest text-blue-400 mb-2 font-semibold"
              }, "Theory Insight · ", currentLevel.theoryInsight.concept),
              React.createElement("p", {
                className: "text-sm text-slate-300 italic mb-3"
              }, currentLevel.theoryInsight.definition),
              React.createElement("p", { className: "text-sm text-slate-300 mb-3" },
                currentLevel.theoryInsight.explanation
              ),
              React.createElement("p", {
                className: "text-xs text-slate-400"
              }, currentLevel.theoryInsight.realWorldParallel),
              React.createElement("div", { className: "mt-4 flex gap-3" },
                React.createElement(Button, {
                  variant: "secondary",
                  className: "flex-1",
                  onClick: () => {
                    setSelectedOption(null);
                    setAiChoice(null);
                    setShowInsight(false);
                  }
                }, "Replay"),
                React.createElement(Button, {
                  variant: "neon",
                  className: "flex-1",
                  onClick: () => {
                    const next = currentLevel.id < ALL_LEVELS.length
                      ? currentLevel.id + 1
                      : 1;
                    openLevel(next);
                  }
                }, "Next Level →")
              )
            )
        )
      );
    }

    // Mount React app
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(StratagemApp));
  </script>
</body>
</html>
